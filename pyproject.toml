[project]
name = "py-qr"
version = "1.1.0"
description = "A python app to generate and read QR-codes."
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "pillow>=13.0.0",
    "pyside6",
    "segno>=1.6.6",
    "zxing-cpp>=3.1.1",
]

[project.scripts]
py-qr = "src.main:main"
main = "src.main:main"
test = "pytest:main"
build = "src.build:main"
format = "src.tools:format_code"
lint = "src.tools:lint_code"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pyinstaller>=6.0",
    "ruff>=0.6",
    "pytest-qt>=4.5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 100
